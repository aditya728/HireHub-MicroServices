## Resilience4J
resilience4j.ratelimiter.rateLimiterAspectOrder=0
resilience4j.circuitbreaker.circuitBreakerAspectOrder=1
resilience4j.retry.retryAspectOrder=2

#Resilience4J RateLimiter for OUR REVIEW-SERVICE
resilience4j.ratelimiter.instances.writeReviewRateLimiter.timeout-duration=0s
resilience4j.ratelimiter.instances.writeReviewRateLimiter.limit-refresh-period=1s
resilience4j.ratelimiter.instances.writeReviewRateLimiter.limit-for-period=5

resilience4j.ratelimiter.instances.readReviewRateLimiter.timeout-duration=0s
resilience4j.ratelimiter.instances.readReviewRateLimiter.limit-refresh-period=1s
resilience4j.ratelimiter.instances.readReviewRateLimiter.limit-for-period=20

## Resilience4J CB & Retry for External COMPANY-SERVICE
resilience4j.retry.instances.companyRetry.max-attempts=3
resilience4j.retry.instances.companyRetry.wait-duration=500ms
resilience4j.retry.instances.companyRetry.ignore-exceptions=feign.FeignException$NotFound

resilience4j.circuitbreaker.instances.companyBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.companyBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.companyBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.companyBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.companyBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.companyBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.companyBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.companyBreaker.sliding-window-type=count_based
resilience4j.circuitbreaker.instances.companyBreaker.ignore-exceptions=feign.FeignException$NotFound
